

spring.application.name=evoting-system

# Thymeleaf template caching (disable for development)
spring.thymeleaf.cache=false

#configuration za database
spring.datasource.url=jdbc:postgresql://localhost:5432/evoting_system
spring.datasource.username=postgres
spring.datasource.password=123456
# jins Hibernate inavyoweza kubadil na kutengeneza tables za databas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration za Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0


#configuration za kuupload file

upload.path=${user.home}/evoting-uploads

#maximam size ya kuupload file ni (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


server.port=${PORT:8080}
