<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Voter - E-Voting System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .edit-form-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            color: #1e3a5f;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            color: #4dabf7;
            text-decoration: none;
        }
        .note {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>E-Voting System</h2>
            <p>Administrator Panel</p>
        </div>
        
        <nav class="sidebar-nav">
            <a th:href="@{/admin/dashboard}">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/admin/voters}" class="active">
                <i class="fas fa-users"></i>
                <span>Voter Management</span>
            </a>
            <a th:href="@{/admin/candidates}">
                <i class="fas fa-user-tie"></i>
                <span>Candidate Management</span>
            </a>
            <a th:href="@{/admin/election}">
                <i class="fas fa-vote-yea"></i>
                <span>Election Control</span>
            </a>
            <a th:href="@{/admin/election/results}">
                <i class="fas fa-chart-bar"></i>
                <span>Results</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <a th:href="@{/logout}">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>
    
    <!-- Main content -->
    <div class="main-content">
        <header>
            <h1>Edit Voter</h1>
        </header>
        
        <div class="content">
            <div class="edit-form-container">
                <a th:href="@{/admin/voters}" class="back-link">
                    <i class="fas fa-arrow-left me-2"></i>Back to Voter Management
                </a>
                
                <div class="card">
                    <div class="card-header">
                        <h3>Update Voter Information</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/voters/update/{id}(id=${user.id})}" th:object="${user}" method="post">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" id="username" th:field="*{username}" placeholder="Enter username" required>
                            </div>
                            <div class="form-group">
                                <label for="password">New Password</label>
                                <input type="password" id="password" th:field="*{password}" placeholder="Enter new password">
                                <p class="note">Leave blank if you don't want to change the password.</p>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Update Voter
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
